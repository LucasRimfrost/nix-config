# ============================================================
#  kitty.conf
# ============================================================

# ── Fonts ────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size        13.0

disable_ligatures cursor
modify_font cell_height 110%

# ── Cursor ───────────────────────────────────────────────────
cursor                     #e0def4
cursor_text_color          #232136
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0
cursor_stop_blinking_after 10.0

# ── Scrollback ───────────────────────────────────────────────
scrollback_lines 10000

# ── Mouse ────────────────────────────────────────────────────
mouse_hide_wait     3.0
focus_follows_mouse no
url_style           curly
url_color           #9ccfd8
detect_urls         yes

# ── Performance ──────────────────────────────────────────────
repaint_delay   10
input_delay     3
sync_to_monitor yes

# ── Bell ─────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab          "🔔 "

# ── Window ───────────────────────────────────────────────────
hide_window_decorations    yes
window_padding_width       3
window_border_width        0pt
draw_minimal_borders       yes
placement_strategy         center

remember_window_size  yes
initial_window_width  1000
initial_window_height 650

background_opacity         0.92
background_blur            0
dynamic_background_opacity yes

# ── Color Scheme: Rose Pine Moon ─────────────────────────────
foreground #e0def4
background #232136

selection_foreground #e0def4
selection_background #44415a

# Black (base/overlay)
color0  #393552
color8  #6e6a86

# Red (love)
color1  #eb6f92
color9  #eb6f92

# Green (pine)
color2  #3e8fb0
color10 #3e8fb0

# Yellow (gold)
color3  #f6c177
color11 #f6c177

# Blue (foam)
color4  #9ccfd8
color12 #9ccfd8

# Magenta (iris)
color5  #c4a7e7
color13 #c4a7e7

# Cyan (foam variant)
color6  #9ccfd8
color14 #9ccfd8

# White (text/subtle)
color7  #908caa
color15 #e0def4

# ── Tab Bar ──────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_min_tabs      1
tab_bar_margin_width  0.0
tab_bar_margin_height 4.0 0.0

tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
active_tab_title_template "{index}: {title}"

active_tab_foreground   #232136
active_tab_background   #c4a7e7
active_tab_font_style   bold

inactive_tab_foreground #6e6a86
inactive_tab_background #2a273f
inactive_tab_font_style normal

tab_bar_background #1f1d2e

# ── Keyboard Shortcuts ───────────────────────────────────────
kitty_mod ctrl+shift

# Windows
map kitty_mod+enter new_window
map kitty_mod+w     close_window
map kitty_mod+]     next_window
map kitty_mod+[     previous_window

# Tabs
map kitty_mod+t     new_tab
map kitty_mod+q     close_tab
map kitty_mod+l     next_tab
map kitty_mod+h     previous_tab
map kitty_mod+alt+t set_tab_title

# Switch tabs with Alt+number
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Font size
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0     change_font_size all 0

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Scrollback
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+k         scroll_line_up
map kitty_mod+j         scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+shift+h   show_scrollback

# Config
map kitty_mod+f2 edit_config_file
map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config

# Layouts
map kitty_mod+r start_resizing_window
map kitty_mod+z toggle_layout stack

# ── Shell & Misc ─────────────────────────────────────────────
shell_integration       enabled
allow_remote_control    no
update_check_interval   24
confirm_os_window_close 0
term                    xterm-kitty
