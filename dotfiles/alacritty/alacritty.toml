[terminal]
osc52 = "Disabled"

[window]
padding = { x = 4, y = 0 }
dynamic_padding = false
opacity = 1.0
dynamic_title = false
decorations = "Full"
startup_mode = "Maximized"

[scrolling]
history = 10000
multiplier = 5

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 14.0
builtin_box_drawing = true

[colors]
transparent_background_colors = false

[colors.primary]
background = "#1d2021"
foreground = "#d4be98"

[colors.cursor]
text = "#1d2021"
cursor = "#d4be98"

[colors.normal]
black = "#32302f"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#d4be98"

[colors.bright]
black = "#32302f"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#d4be98"

[cursor]
style = { shape = "Block", blinking = "Never" }
unfocused_hollow = true
thickness = 0.2

[mouse]
hide_when_typing = true
