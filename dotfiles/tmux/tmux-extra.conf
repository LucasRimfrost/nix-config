# ============================================================================
# tmux-extra.conf — everything not handled by home-manager's programs.tmux
# options. Read verbatim via builtins.readFile, so tmux/shell syntax like
# ${L_SEP} and the backslash line-continuations stay exactly as written.
# ============================================================================

set -ag terminal-overrides ",*:RGB"
set -g set-clipboard on

# Splits
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Enter copy-mode
unbind [
bind Space copy-mode

# Pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Alt+hjkl to switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set-option -g renumber-windows on

# Shift+arrows to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-style copying. CHANGED: clipboard via wl-copy (Wayland) instead of xclip (X11).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==========================================
# ROSE-PINE COLOR DEFINITIONS
# ==========================================
thm_base="#191724"
thm_surface="#1f1d2e"
thm_overlay="#26233a"
thm_text="#e0def4"
thm_rose="#ebbcba"
thm_pine="#31748f"
thm_gold="#f6c177"
thm_love="#eb6f92"
thm_iris="#c4a7e7"

# ==========================================
# SEPARATORS
# ==========================================
L_SEP=""
R_SEP=""

# ==========================================
# STATUS BAR GENERAL
# ==========================================
set-option -g status "on"
set-option -g status-style bg=default,fg=$thm_text
set-option -g status-interval 1
set-option -g status-justify "left"
set-option -g status-left-length "100"
set-option -g status-right-length "100"

set-option -g pane-border-style fg=$thm_overlay
set-option -g pane-active-border-style fg=$thm_rose

set-option -g message-style bg=$thm_surface,fg=$thm_rose
set-option -g message-command-style bg=$thm_surface,fg=$thm_rose

# ==========================================
# STATUS LEFT (Session Name)
# ==========================================
set-option -g status-left "#[fg=$thm_iris,bg=default]${L_SEP}#[bg=$thm_iris,fg=$thm_base,bold]  #S #[bg=default,fg=$thm_iris]${R_SEP} "

# ==========================================
# WINDOW STATUS
# ==========================================
set-window-option -g window-status-format "#[fg=#908caa] #I: #W "

set-window-option -g window-status-current-format "\
#[fg=$thm_rose,bg=default]${L_SEP}\
#[bg=$thm_rose,fg=$thm_base,bold] #I \
#[fg=$thm_rose,bg=$thm_surface]${R_SEP}\
#[fg=$thm_text,bg=$thm_surface] #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) \
#[fg=$thm_surface,bg=default]${R_SEP}"

set-window-option -g window-status-separator ""

# ==========================================
# STATUS RIGHT (Prefix & Host)
# ==========================================
set-option -g status-right "\
#{?client_prefix,#[fg=$thm_gold],#[fg=$thm_pine]}#[bg=default]${L_SEP}\
#{?client_prefix,#[bg=$thm_gold],#[bg=$thm_pine]}#[fg=$thm_base,bold]  #h \
#{?client_prefix,#[fg=$thm_gold],#[fg=$thm_pine]}#[bg=default]${R_SEP}"

# ==========================================
# BELL / ACTIVITY
# ==========================================
set-window-option -g window-status-activity-style bg=default,fg=$thm_love
set-window-option -g window-status-bell-style bg=$thm_love,fg=$thm_base
